{% extends 'core/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Pripremi Dokument za Slanje{% endblock %}

{% block content %}
<div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">📧 Pripremi Dokument za Slanje</h1>
    <p class="mb-4">Master Templejt: <strong>{{ master_templejt.naziv }}</strong></p>

    <form method="post" enctype="multipart/form-data" id="send-document-form">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form|crispy }}
        </div>
        <div class="mt-6 flex justify-end space-x-4">
            <a href="{% url 'core:file_manager' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                Odustani
            </a>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Pošalji i Arhiviraj 📤
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/5/tinymce.min.js" referrerpolicy="origin"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        tinymce.init({
            selector: '#id_poruka',
            plugins: 'autolink lists link image charmap print preview hr anchor pagebreak',
            toolbar_mode: 'floating',
        });

        const klijentSelect = document.getElementById('id_klijent');
        const primaociContainer = document.getElementById('div_id_primaoci');
        const emailTemplejtSelect = document.getElementById('id_email_templejt');
        const naslovInput = document.getElementById('id_naslov');

        klijentSelect.addEventListener('change', function() {
            const klijentId = this.value;
            if (!klijentId) {
                primaociContainer.innerHTML = '';
                return;
            }
            fetch(`{% url 'core:get_klijent_kontakti' %}?klijent_id=${klijentId}`)
                .then(response => response.json())
                .then(data => {
                    let checkboxes = '';
                    data.forEach(kontakt => {
                        checkboxes += `
                            <div class="form-check">
                                <input type="checkbox" name="primaoci" value="${kontakt.id}" class="form-check-input" id="id_primaoci_${kontakt.id}">
                                <label class="form-check-label" for="id_primaoci_${kontakt.id}">${kontakt.ime_i_prezime}</label>
                            </div>
                        `;
                    });
                    document.querySelector('#div_id_primaoci .controls').innerHTML = checkboxes;
                });
        });

        emailTemplejtSelect.addEventListener('change', function() {
            const templejtId = this.value;
            if (!templejtId) return;
            fetch(`{% url 'core:get_email_templejt' %}?templejt_id=${templejtId}`)
                .then(response => response.json())
                .then(data => {
                    naslovInput.value = data.naslov;
                    tinymce.get('id_poruka').setContent(data.telo);
                });
        });
    });
</script>
{% endblock %}
