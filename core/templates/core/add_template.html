{% extends 'core/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Dodaj Novi Master Templejt{% endblock %}

{% block content %}
<div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">📄 Dodaj Novi Master Templejt</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form|crispy }}
        </div>
        <div class="mt-6 flex justify-end space-x-4">
            <a href="{% url 'core:file_manager' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                Odustani
            </a>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Sačuvaj Templejt
            </button>
        </div>
    </form>
</div>
{% endblock %}
